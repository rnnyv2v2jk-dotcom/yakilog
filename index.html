<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>焼きログ — 関東 日焼けスポットマップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Carbon Design System トークン ── */
    :root {
      --cds-background:        #ffffff;
      --cds-layer-01:          #f4f4f4;
      --cds-layer-02:          #ffffff;
      --cds-border-subtle:     #e0e0e0;
      --cds-border-strong:     #8d8d8d;
      --cds-text-primary:      #161616;
      --cds-text-secondary:    #525252;
      --cds-text-placeholder:  #a8a8a8;
      --cds-text-on-color:     #ffffff;
      --cds-interactive:       #0f62fe;
      --cds-interactive-hover: #0050e6;
      --cds-focus:             #0f62fe;
      --cds-support-error:     #da1e28;
      --cds-support-success:   #198038;
      --cds-support-warning:   #f1c21b;
      --cds-support-info:      #0043ce;
      /* アクセント（焼きログ固有） */
      --yaki-sun:   #f1c21b;
      --yaki-coral: #da1e28;
      --yaki-ocean: #0043ce;
      --yaki-green: #198038;
    }

    body {
      font-family: 'IBM Plex Sans JP', 'IBM Plex Sans', -apple-system, sans-serif;
      background: var(--cds-background);
      color: var(--cds-text-primary);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      font-size: 14px;
      line-height: 1.42857;
    }

    /* ══ HEADER ══ */
    header {
      height: 48px;
      background: #161616;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 0; }

    /* IBM 8px グリッド準拠のロゴ */
    .logo-bar {
      display: flex; align-items: center; gap: 8px;
    }
    /* IBM 8本バー風アイコン */
    .ibm-icon {
      width: 20px; height: 20px; flex-shrink: 0;
      display: flex; flex-direction: column;
      justify-content: space-between; padding: 1px 0;
    }
    .ibm-icon span {
      display: block; height: 2px;
      background: #f1c21b;
    }
    .ibm-icon span:nth-child(2),
    .ibm-icon span:nth-child(4),
    .ibm-icon span:nth-child(6) {
      width: 68%;
    }

    .logo-wordmark {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 16px; font-weight: 600;
      color: #ffffff; letter-spacing: 0;
      line-height: 1;
    }
    .logo-wordmark span { color: #f1c21b; }
    .logo-divider {
      width: 1px; height: 20px;
      background: #393939; margin: 0 12px;
    }
    .logo-product {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px; font-weight: 300;
      color: #c6c6c6; letter-spacing: 0.01em;
    }

    #add-btn {
      height: 32px;
      padding: 0 15px;
      background: var(--cds-interactive);
      color: #fff;
      border: none;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px; font-weight: 400;
      cursor: pointer;
      letter-spacing: 0.16px;
      transition: background 0.1s;
      white-space: nowrap;
    }
    #add-btn:hover { background: var(--cds-interactive-hover); }

    /* ══ MAP ══ */
    #map { flex: 1; z-index: 0; }

    /* ══ FILTER BAR — Carbon Tab Bar ══ */
    #filter-bar {
      position: absolute;
      top: 48px; left: 0; right: 0;
      display: flex;
      z-index: 1000;
      background: #161616;
      border-bottom: 1px solid #393939;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #filter-bar::-webkit-scrollbar { display: none; }

    .filter-btn {
      flex-shrink: 0;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0 16px;
      height: 40px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px; font-weight: 400;
      cursor: pointer;
      background: transparent;
      color: #8d8d8d;
      transition: color 0.1s, border-color 0.1s;
      white-space: nowrap;
      letter-spacing: 0.16px;
    }
    .filter-btn:hover { color: #f4f4f4; background: #2d2d2d; }
    .filter-btn.active {
      color: #f4f4f4;
      border-bottom-color: var(--cds-interactive);
    }

    /* ══ SPOT COUNT ══ */
    #spot-count {
      position: absolute; bottom: 24px; right: 0;
      background: #161616;
      border-left: 3px solid var(--cds-interactive);
      padding: 6px 16px 6px 13px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 12px; font-weight: 400;
      letter-spacing: 0.32px;
      color: #c6c6c6;
      z-index: 1000;
    }

    /* ══ LEGEND ══ */
    #legend {
      position: absolute; bottom: 56px; left: 0;
      background: #161616;
      border-right: 1px solid #393939;
      padding: 12px 16px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 12px; z-index: 1000; line-height: 2;
    }
    .legend-title {
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.5px; text-transform: uppercase;
      color: #6f6f6f; margin-bottom: 4px;
    }
    #legend .legend-item {
      display: flex; align-items: center; gap: 8px;
      color: #c6c6c6; font-weight: 400;
    }
    .dot { width: 8px; height: 8px; flex-shrink: 0; }
    .dot-outdoor { background: var(--yaki-coral); }
    .dot-salon   { background: #8a3ffc; }
    .dot-user    { background: var(--cds-interactive); }

    /* ══ MODAL — Carbon Sheet ══ */
    #modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(22,22,22,0.5); z-index: 2000;
      align-items: flex-end; justify-content: center;
    }
    #modal-overlay.open { display: flex; }
    #modal {
      background: var(--cds-layer-02);
      border-top: 1px solid var(--cds-border-subtle);
      padding: 0; width: 100%; max-width: 600px;
      max-height: 92dvh; overflow-y: auto;
    }
    .modal-handle { display: none; }
    .modal-header {
      background: #161616;
      padding: 16px;
      border-bottom: 1px solid #393939;
    }
    .modal-header h2 {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 20px; font-weight: 400;
      color: #ffffff; letter-spacing: 0;
    }
    .modal-header p {
      font-size: 12px; color: #6f6f6f;
      margin-top: 2px; letter-spacing: 0.32px;
    }
    .modal-body { padding: 16px; }
    .modal-hint {
      font-size: 12px; color: var(--cds-text-secondary);
      margin-bottom: 16px;
      background: #edf5ff;
      padding: 10px 14px;
      border-left: 3px solid var(--cds-interactive);
      line-height: 1.6;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 12px; font-weight: 400;
      margin-bottom: 8px; color: var(--cds-text-secondary);
      letter-spacing: 0.32px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      border: none;
      border-bottom: 1px solid var(--cds-border-strong);
      padding: 11px 16px 11px 0;
      font-size: 14px;
      font-family: 'IBM Plex Sans JP', 'IBM Plex Sans', sans-serif;
      background: var(--cds-layer-01);
      color: var(--cds-text-primary);
      transition: border-color 0.1s, outline 0.1s;
      letter-spacing: 0.16px;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: 2px solid var(--cds-focus);
      outline-offset: -2px;
      border-bottom-color: transparent;
    }
    .field textarea { resize: vertical; min-height: 80px; padding: 11px 16px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; }

    /* PHOTO UPLOAD */
    .photo-upload-area {
      border: 1px dashed var(--cds-border-strong);
      padding: 24px 16px; text-align: center; cursor: pointer;
      background: var(--cds-layer-01); position: relative;
      transition: background 0.1s;
    }
    .photo-upload-area:hover { background: #e8e8e8; }
    .photo-upload-area input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
      width: 100%; height: 100%;
    }
    .photo-upload-area .upload-icon { font-size: 24px; margin-bottom: 8px; color: var(--cds-text-secondary); }
    .photo-upload-area .upload-text { font-size: 14px; color: var(--cds-text-secondary); }
    .photo-upload-area .upload-sub  { font-size: 12px; color: var(--cds-text-placeholder); margin-top: 4px; }
    #photo-preview {
      width: 100%; height: 140px; object-fit: cover;
      display: none; margin-top: 8px;
    }

    .modal-actions { display: flex; gap: 1px; padding: 0; margin-top: 8px; }
    .btn-cancel {
      flex: 1; background: var(--cds-layer-01); border: none;
      padding: 16px; font-size: 14px; font-weight: 400;
      cursor: pointer; color: var(--cds-text-primary);
      font-family: 'IBM Plex Sans', sans-serif;
      letter-spacing: 0.16px;
      transition: background 0.1s;
    }
    .btn-cancel:hover { background: #e8e8e8; }
    .btn-submit {
      flex: 2;
      background: var(--cds-interactive);
      color: #fff; border: none; padding: 16px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px; font-weight: 400;
      cursor: pointer; letter-spacing: 0.16px;
      transition: background 0.1s;
    }
    .btn-submit:hover { background: var(--cds-interactive-hover); }

    /* ══ POPUP ══ */
    .leaflet-popup-content-wrapper {
      border-radius: 0 !important;
      padding: 0 !important;
      overflow: hidden;
      background: #ffffff !important;
      border: 1px solid #e0e0e0 !important;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12) !important;
      min-width: 280px !important;
    }
    .leaflet-popup-content { margin: 0 !important; width: auto !important; }
    .leaflet-popup-close-button {
      color: #525252 !important; font-size: 16px !important;
      padding: 8px 10px !important; top: 0 !important; right: 0 !important;
    }
    .leaflet-popup-tip { background: #ffffff !important; }

    /* ══ FOOTER ══ */
    footer {
      text-align: center; font-size: 12px;
      color: #6f6f6f;
      padding: 6px 16px; letter-spacing: 0.32px;
      background: #161616; flex-shrink: 0;
      border-top: 1px solid #393939;
      font-family: 'IBM Plex Sans', sans-serif;
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-bar">
      <div class="ibm-icon">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span>
      </div>
      <div class="logo-wordmark">焼き<span>ログ</span></div>
      <div class="logo-divider"></div>
      <div class="logo-product">関東 日焼けスポットマップ</div>
    </div>
  </div>
  <button id="add-btn">スポットを追加</button>
</header>

<div id="map"></div>

<div id="filter-bar">
  <button class="filter-btn active" data-filter="all">すべて</button>
  <button class="filter-btn" data-filter="outdoor">☀ 屋外スポット</button>
  <button class="filter-btn" data-filter="salon">✦ 日サロ</button>
  <button class="filter-btn" data-filter="tokyo">東京</button>
  <button class="filter-btn" data-filter="kanagawa">神奈川</button>
  <button class="filter-btn" data-filter="saitama">埼玉</button>
  <button class="filter-btn" data-filter="chiba">千葉</button>
</div>

<div id="legend">
  <div class="legend-title">Legend</div>
  <div class="legend-item"><div class="dot dot-outdoor"></div>屋外スポット</div>
  <div class="legend-item"><div class="dot dot-salon"></div>日サロ</div>
  <div class="legend-item"><div class="dot dot-user"></div>投稿スポット</div>
</div>

<div id="spot-count"></div>

<div id="modal-overlay">
  <div id="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2>スポットを追加</h2>
      <p>Add your favorite tan spot to the map</p>
    </div>
    <div class="modal-body">
      <div class="modal-hint">
        地図をクリックすると緯度・経度が自動入力されます。
      </div>
      <div class="field">
        <label>スポット名 *</label>
        <input type="text" id="f-name" placeholder="例: 代々木公園 芝生エリア" />
      </div>
      <div class="field">
        <label>カテゴリー</label>
        <select id="f-type">
          <option value="outdoor">☀ 屋外スポット</option>
          <option value="salon">✦ 日サロ</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field">
          <label>緯度</label>
          <input type="number" id="f-lat" step="0.0001" placeholder="35.6762" />
        </div>
        <div class="field">
          <label>経度</label>
          <input type="number" id="f-lng" step="0.0001" placeholder="139.6503" />
        </div>
      </div>
      <div class="field">
        <label>コメント</label>
        <textarea id="f-memo" placeholder="例: 芝生が広くて最高。夏の午後が狙い目。"></textarea>
      </div>
      <div class="field">
        <label>写真</label>
        <div class="photo-upload-area" id="upload-area">
          <input type="file" id="f-photo" accept="image/*" />
          <div class="upload-icon">📷</div>
          <div class="upload-text">クリックして写真を追加</div>
          <div class="upload-sub">JPG · PNG · HEIC · 最大5MB</div>
        </div>
        <img id="photo-preview" src="" alt="preview" />
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancel-btn">キャンセル</button>
      <button class="btn-submit" id="submit-btn">ピンを追加</button>
    </div>
  </div>
</div>

<footer>焼きログ &nbsp;·&nbsp; Made with IBM Bob</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

}).addTo(map);

// ─────────────────────────────────────────────
//  ICON
// ─────────────────────────────────────────────
function makeIcon(type) {
  // Carbon: outdoor=#da1e28, salon=#8a3ffc, user=#0f62fe
  const configs = {
    outdoor: { color:'#da1e28', emoji:'☀' },
    salon:   { color:'#8a3ffc', emoji:'✦' },
    user:    { color:'#0f62fe', emoji:'＋' }
  };
  const c = configs[type] || configs.user;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40">
    <filter id="sh${type}"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/></filter>
    <path filter="url(#sh${type})" d="M16 1C8.268 1 2 7.268 2 15c0 9.5 14 24 14 24S30 24.5 30 15C30 7.268 23.732 1 16 1z" fill="${c.color}"/>
    <circle cx="16" cy="15" r="8" fill="white"/>
    <text x="16" y="19" text-anchor="middle" font-size="9" font-family="system-ui" fill="${c.color}">${c.emoji}</text>
  </svg>`;
  return L.divIcon({ html:svg, className:'', iconSize:[32,40], iconAnchor:[16,40], popupAnchor:[0,-44] });
}

// ─────────────────────────────────────────────
//  POPUP HTML
// ─────────────────────────────────────────────
function buildPopup(spot) {
  const iconType = spot.preset ? spot.type : 'user';
  const prefColors = { tokyo:'#da1e28', kanagawa:'#0043ce', saitama:'#198038', chiba:'#f1c21b' };
  const prefNames  = { tokyo:'東京', kanagawa:'神奈川', saitama:'埼玉', chiba:'千葉' };
  const badgeColor = iconType === 'outdoor' ? '#da1e28'
                   : iconType === 'salon'   ? '#8a3ffc'
                   :                          '#0f62fe';
  const badgeLabel = iconType === 'outdoor' ? '屋外スポット' : iconType === 'salon' ? '日サロ' : '投稿スポット';
  const stars = spot.rating ? '★'.repeat(spot.rating) + '☆'.repeat(5 - spot.rating) : '';
  const photoSrc = spot.photo || '';

  const photoHtml = photoSrc
    ? `<div style="width:100%;height:140px;overflow:hidden;background:#e0e0e0;">
         <img src="${photoSrc}" alt="${spot.name}" style="width:100%;height:100%;object-fit:cover;display:block;" loading="lazy"
           onerror="this.parentElement.style.display='none'" />
       </div>`
    : `<div style="width:100%;height:4px;background:${badgeColor};"></div>`;

  const prefBg = prefColors[spot.pref] || '#8d8d8d';
  const prefTc = spot.pref === 'chiba' ? '#161616' : '#fff';

  return `
    <div style="font-family:'IBM Plex Sans JP','IBM Plex Sans',system-ui,sans-serif;width:280px;background:#fff;overflow:hidden;">
      ${photoHtml}
      <div style="padding:12px 16px 0;border-bottom:1px solid #e0e0e0;padding-bottom:12px;">
        <div style="font-size:16px;font-weight:600;color:#161616;line-height:1.25;letter-spacing:0;margin-bottom:6px;">${spot.name}</div>
        <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;">
          <span style="background:${badgeColor};color:#fff;font-size:10px;font-weight:400;padding:1px 8px;letter-spacing:0.32px;">${badgeLabel}</span>
          ${spot.pref ? `<span style="background:${prefBg};color:${prefTc};font-size:10px;font-weight:400;padding:1px 8px;letter-spacing:0.32px;">${prefNames[spot.pref]||''}</span>` : ''}
          ${stars ? `<span style="color:#f1c21b;font-size:12px;margin-left:2px;">${stars}</span>` : ''}
        </div>
      </div>
      <div style="padding:12px 16px;">
        ${spot.area ? `<div style="font-size:11px;color:#8d8d8d;letter-spacing:0.32px;margin-bottom:6px;">${spot.area}</div>` : ''}
        <div style="font-size:13px;color:#525252;line-height:1.6;margin-bottom:8px;letter-spacing:0.16px;">${spot.memo || ''}</div>
        ${spot.tips ? `<div style="font-size:12px;color:#0f62fe;background:#edf5ff;padding:8px 12px;border-left:3px solid #0f62fe;line-height:1.5;letter-spacing:0.16px;">${spot.tips}</div>` : ''}
      </div>
    </div>`;
}

// ─────────────────────────────────────────────
//  MARKERS
// ─────────────────────────────────────────────
const markers = {};
let currentFilter = 'all';

function addMarker(spot) {
  const iconType = spot.preset ? spot.type : 'user';
  const marker = L.marker([spot.lat, spot.lng], { icon: makeIcon(iconType) }).addTo(map);
  marker.bindPopup(buildPopup(spot), { maxWidth: 280 });
  marker.spotType = spot.type;
  markers[spot.id] = marker;
}

// ─────────────────────────────────────────────
//  LOCALSTORAGE
// ─────────────────────────────────────────────
function loadUserSpots() {
  try { return JSON.parse(localStorage.getItem('yakilog_spots') || '[]'); }
  catch { return []; }
}
function saveUserSpots(spots) {
  localStorage.setItem('yakilog_spots', JSON.stringify(spots));
}

// ─────────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────────
function renderAll() {
  const all = [...PRESET_SPOTS, ...loadUserSpots()];
  Object.values(markers).forEach(m => map.removeLayer(m));
  Object.keys(markers).forEach(k => delete markers[k]);
  let count = 0;
  all.forEach(spot => {
    const matchType = currentFilter === 'all' || spot.type === currentFilter;
    const matchPref = !['tokyo','kanagawa','saitama','chiba'].includes(currentFilter) || spot.pref === currentFilter;
    if (matchType && matchPref) {
      addMarker(spot); count++;
    }
  });
  document.getElementById('spot-count').textContent = `📍 ${count} SPOTS`;
}
renderAll();

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentFilter = this.dataset.filter;
    renderAll();
  });
});

document.getElementById('f-photo').addEventListener('change', function() {

  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { alert('画像は5MB以下にしてください。'); this.value = ''; return; }
  const reader = new FileReader();
  reader.onload = e => {
    photoDataUrl = e.target.result;
    const preview = document.getElementById('photo-preview');
    preview.src = photoDataUrl;
    preview.style.display = 'block';
    document.querySelector('.upload-text').textContent = '✅ 写真を変更';
  };
  reader.readAsDataURL(file);
});

// ─────────────────────────────────────────────
//  MODAL
// ─────────────────────────────────────────────
function openModal() { document.getElementById('modal-overlay').classList.add('open'); }

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  ['f-name','f-memo','f-lat','f-lng'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('f-type').value = 'outdoor';
  document.getElementById('f-photo').value = '';
  document.getElementById('photo-preview').style.display = 'none';
  document.querySelector('.upload-text').textContent = '写真をタップして追加';
  photoDataUrl = null;
}

document.getElementById('add-btn').addEventListener('click', openModal);
document.getElementById('cancel-btn').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.getElementById('submit-btn').addEventListener('click', function() {
  const name = document.getElementById('f-name').value.trim();
  const type = document.getElementById('f-type').value;
  const lat  = parseFloat(document.getElementById('f-lat').value);
  const lng  = parseFloat(document.getElementById('f-lng').value);
  const memo = document.getElementById('f-memo').value.trim();

  if (!name) { alert('Spot name is required!'); return; }
  if (isNaN(lat) || isNaN(lng)) { alert('Please enter valid coordinates.'); return; }
  if (lat < 35.2 || lat > 36.2 || lng < 138.8 || lng > 140.5) {
    if (!confirm('This location seems outside Tokyo. Add anyway?')) return;
  }

  const newSpot = {
    id: 'u_' + Date.now(), name, type, lat, lng, memo,
    area: '投稿スポット',
    photo: photoDataUrl || '',
    preset: false
  };

  const userSpots = loadUserSpots();
  userSpots.push(newSpot);
  saveUserSpots(userSpots);
  closeModal();
  renderAll();
  map.setView([lat, lng], 15);
  setTimeout(() => markers[newSpot.id] && markers[newSpot.id].openPopup(), 300);
});
</script>
</body>
